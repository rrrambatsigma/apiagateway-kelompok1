# =====================================================================
# KAMU: Konfigurasi utama gateway (skeleton minimal).
# Fitur gateway (rate limit, auth, authorization, validation, logging)
# dikerjakan TEMAN — tambahkan di sini / di conf.d/*.conf.
# =====================================================================
worker_processes auto;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;

    # TEMAN: letakkan di sini misalnya log_format custom,
    # limit_req_zone (rate limiter), dan map validasi header.

    include /etc/nginx/conf.d/*.conf;
}