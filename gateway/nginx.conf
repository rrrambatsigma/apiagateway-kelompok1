# =====================================================================
# Main Nginx Gateway Configuration
# =====================================================================

worker_processes auto;

error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;

    # =================================================================
    # RATE LIMITER
    # 5 requests/second per client IP
    # =================================================================

    limit_req_zone $binary_remote_addr zone=api_rate_limit:10m rate=5r/s;


    # =================================================================
    # REQUEST VALIDATION
    # POST / PUT / PATCH pada API harus menggunakan JSON
    # =================================================================

    # Cek apakah Content-Type adalah application/json
    map $http_content_type $is_json_content_type {
        default 0;
        ~*^application/json 1;
    }

    # Tandai request POST/PUT/PATCH yang bukan JSON
    map "$request_method:$is_json_content_type" $invalid_json_request {
        default 0;

        "POST:0" 1;
        "PUT:0" 1;
        "PATCH:0" 1;
    }


    # =================================================================
    # LOAD CONFIGURATION
    # =================================================================

    include /etc/nginx/conf.d/*.conf;
}