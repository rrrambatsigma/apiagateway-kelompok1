# =====================================================================
# Route /api/*
#
# Person 3:
#   - Rate limiter
#   - Gateway-level request validation
#
# Person 2:
#   - Authentication / Authorization
#
# Person 1:
#   - Reverse proxy / routing
# =====================================================================


# =====================================================================
# API ROUTE
# =====================================================================

location /api/ {

    access_log /dev/stdout json_combined;

    # ================================================================
    # 1. RATE LIMITER
    # ================================================================
    # 5 requests/second per IP
    # Burst maksimal 5 request
    # nodelay = request burst tidak ditunda

    limit_req zone=api_rate_limit burst=5 nodelay;

    # Return HTTP 429 when rate limit is exceeded
    limit_req_status 429;


    # ================================================================
    # 2. REQUEST VALIDATION
    # ================================================================
    # POST / PUT / PATCH harus menggunakan application/json

    if ($invalid_json_request) {
        return 415;
    }


    # ================================================================
    # 3. AUTHENTICATION & AUTHORIZATION
    # ================================================================

    auth_request /_auth/authorize;

    # Jangan ubah auth_request_set milik Person 2
    # auth_request_set $auth_user $upstream_http_x_user;


    # ================================================================
    # 4. REVERSE PROXY
    # ================================================================

    proxy_pass http://backend;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}


# =====================================================================
# Internal authentication validation
# =====================================================================

location = /_auth/validate {

    internal;

    proxy_pass http://api:8000/auth/validate;

    proxy_pass_request_body off;
    proxy_set_header Content-Length "";

    proxy_set_header Authorization $http_authorization;
}


# =====================================================================
# Internal authentication & authorization
# =====================================================================

location = /_auth/authorize {

    internal;

    proxy_pass http://api:8000/auth/authorize;

    proxy_pass_request_body off;
    proxy_set_header Content-Length "";

    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Original-URI $request_uri;
    proxy_set_header X-Original-Method $request_method;
}