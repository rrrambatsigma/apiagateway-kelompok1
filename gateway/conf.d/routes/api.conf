# =====================================================================
# Route /api/* — skeleton reverse proxy (KAMU).
#
# TEMAN: lengkapi bagian ini dengan:
#   - rate limiter      (limit_req)
#   - authentication    (auth_request -> service auth / JWT)
#   - authorization     (cek role per route)
#   - request validation (cek body/header/parameter)
#   - logging           (log request/response terstruktur)
#
# Load balancing: atur upstream di conf.d/upstreams.conf.
# =====================================================================
location /api/ {
    # ---------- TEMAN: rate limiter ----------
    # limit_req zone=... burst=... nodelay;

    # ---------- TEMAN: authentication & authorization ----------
    auth_request /_auth/authorize;
    # auth_request_set $auth_user $upstream_http_x_user;

    # ---------- TEMAN: request validation ----------
    # if (...) { return 400 '...'; }

    # ---------- Reverse proxy ke upstream backend (skeleton) ----------
    proxy_pass http://backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /_auth/validate {
    internal;
    proxy_pass http://api:8000/auth/validate;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Authorization $http_authorization;
}

location = /_auth/authorize {
    internal;

    proxy_pass http://api:8000/auth/authorize;

    proxy_pass_request_body off;
    proxy_set_header Content-Length "";

    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Original-URI $request_uri;
    proxy_set_header X-Original-Method $request_method;
}