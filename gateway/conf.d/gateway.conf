# =====================================================================
# KAMU: server block gateway (skeleton minimal).
# Reverse proxy /api/* didelegasikan ke conf.d/routes/*.conf.
# Fitur gateway (auth, rate limit, validation, logging) dikerjakan TEMAN.
# =====================================================================
server {
    listen 80;
    server_name _;

    # TEMAN: tambahkan di sini akses log custom / client_max_body_size.

    # ---------- Health check gateway sendiri (untuk demo) ----------
    location = /healthz {
        access_log off;
        return 200 "gateway ok\n";
    }

    # ---------- Banner root ----------
    location = / {
        access_log off;
        default_type application/json;
        return 200 '{"gateway":"api-gateway-kelompok1","docs":"/api/"}';
    }

    # ---------- Route API (skeleton reverse proxy) ----------
    include /etc/nginx/conf.d/routes/*.conf;

    # ---------- Fallback ----------
    location / {
        return 404 '{"error":"not found"}';
    }
}