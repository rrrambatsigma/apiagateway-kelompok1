# =====================================================================
# TEMAN: Load Balancing (upstream) & target reverse proxy.
#
# Kamu yang isi bagian ini: tambah instance API, pilih algoritma LB,
# health check, dan integrasi service discovery + circuit breaker.
# =====================================================================
upstream backend {
    # Saat ini 1 instance supaya sistem bisa jalan.
    # TEMAN: tambahkan instance lain untuk demo load balancing, misal:
    #   least_conn;                 # algoritma LB (opsional: round-robin default)
    #   server api-1:8000 weight=3; # api-1 dapat 3x lebih banyak request
    #   server api-2:8000 weight=1;
    #
    # TEMAN (health check pasif nginx): atur max_fails & fail_timeout
    #   server api:8000 max_fails=3 fail_timeout=30s;
    server api:8000;

    # TEMAN (health check aktif + circuit breaker):
    # lakukan lewat Service Discovery service (lihat services/discovery/README.md)
    # yang menulis ulang file ini dan reload nginx.
}