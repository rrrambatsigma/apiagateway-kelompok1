# =====================================================================
# Load Balancing Configuration
#
# Default Nginx: round-robin (bergantian ke semua instance).
# Algoritma lain:
#   least_conn;          # kirim ke instance dengan koneksi paling sedikit
#   ip_hash;             # IP yang sama selalu ke instance yang sama
# =====================================================================

upstream backend {
    server api-1:8000 max_fails=3 fail_timeout=30s;
    server api-2:8000 max_fails=3 fail_timeout=30s;
    server api-3:8000 max_fails=3 fail_timeout=30s;
}